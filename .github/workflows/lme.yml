name: LME 알루미늄 갱신

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # 하루 4번 확인 (한국시간 오전 9시·오후 3시·오후 9시·새벽 3시). 새 데이터가 있을 때만 커밋
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_lme.py
      - name: 변경 사항 커밋
        run: |
          git config user.name "lme-sync"
          git config user.email "lme-sync@users.noreply.github.com"
          git add lme.js
          git diff --cached --quiet && exit 0
          git commit -m "LME 알루미늄 갱신"
          git pull --rebase
          git push
