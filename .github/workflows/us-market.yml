name: 미국장 마감 갱신

on:
  schedule:
    - cron: '0 0 * * *' # 매일 한국시간 오전 9시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 미국장 마감 데이터 수집
        env:
          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}
        run: python fetch_us_market.py
      - name: 새 마감 기록 커밋
        run: |
          git config user.name 'us-market-sync'
          git config user.email 'us-market-sync@users.noreply.github.com'
          git add us-market.js
          git diff --cached --quiet && exit 0
          git commit -m '미국장 마감 갱신'
          git pull --rebase
          git push
