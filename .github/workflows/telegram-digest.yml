name: 텔레그램 공시 정리

# 봇에게 /정리 가 왔는지 몇 분마다 확인하고, 왔으면 정리본을 보낸다 (telegram_digest.py)
# 내용은 저장하지 않으며 로그에는 건수만 남긴다.
on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: telegram_digest.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 정리 요청 확인
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN 비밀값이 아직 없어요"; exit 0; fi
          python telegram_digest.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
