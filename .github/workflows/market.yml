name: 낸드·GPU 가격 갱신

on:
  schedule:
    - cron: "20 0,6,12,18 * * *"
    - cron: "45 12 * * 1" # Monday 21:45 KST, after the previous trading week.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git pull --rebase
      - name: 가격 수집
        id: prices
        continue-on-error: true
        env:
          NAND_FEED_URL: ${{ secrets.NAND_FEED_URL }}
          NAND_FEED_TOKEN: ${{ secrets.NAND_FEED_TOKEN }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          UPDATE_CORRELATION: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '45 12 * * 1' }}
        run: |
          args=()
          if [ "$UPDATE_CORRELATION" = "true" ]; then args+=(--weekly-correlation); fi
          python fetch_market.py "${args[@]}"
      - name: 수집한 가격 반영
        run: |
          git config user.name "market-sync"
          git config user.email "market-sync@users.noreply.github.com"
          git add market-data.js
          git diff --cached --quiet && exit 0
          git commit -m "낸드·GPU 가격 갱신"
          git pull --rebase
          git push
      - name: 수집 오류 표시
        if: steps.prices.outcome == 'failure'
        run: exit 1
