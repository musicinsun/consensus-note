name: 노션 동기화

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: data-push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sync_notion.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: 변경 사항 커밋
        run: |
          git config user.name "notion-sync"
          git config user.email "notion-sync@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet && exit 0
          git commit -m "노션 동기화"
          git pull --rebase
          git push
