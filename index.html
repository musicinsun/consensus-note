<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>컨센서스 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:20px;color:var(--muted);font-size:13px}
.stats b{display:block;color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.bar input,.bar select{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.bar input:focus,.bar select:focus{border-color:var(--accent)}
#q{flex:1 1 220px;min-width:0}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--star);margin:0}
.day{margin-top:28px}
.day-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.day-head h2{margin:0;font-size:17px;letter-spacing:-.01em}
.day-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
a.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.name{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.3;word-break:keep-all}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:auto}
.up{font-weight:700;font-variant-numeric:tabular-nums}
.up.pos{color:var(--up)} .up.neg{color:var(--down)}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.chip.C{color:var(--cb);background:var(--cb-soft)}
.chip.B{color:var(--buy);background:var(--buy-soft)}
.chip.H,.chip.S{color:var(--hold);background:var(--hold-soft)}
.chip.N,.chip.J{color:var(--nr);background:var(--nr-soft)}
.study{color:var(--star);font-size:12px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:60px 0}
footer{margin-top:48px;color:var(--muted);font-size:12px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head h2{margin:0;font-size:15px}
.panel-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.kpi{text-align:right;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:22px;color:var(--text);font-variant-numeric:tabular-nums}
.delta.pos{color:var(--up)} .delta.neg{color:var(--down)}
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;height:220px;overflow:visible}
.chart .grid line{stroke:var(--line)}
.chart .axis text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.08}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-dasharray:3 3}
.chart .vlabel{fill:var(--text);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.tip b{font-size:13px}
details.tbl{margin-top:6px;font-size:13px;color:var(--muted)}
details.tbl summary{cursor:pointer;width:max-content}
details.tbl table{border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:4px 14px 4px 0;text-align:left;font-weight:400;border-bottom:1px solid var(--line)}
details.tbl th{color:var(--muted)} details.tbl td{color:var(--text)}
.picks{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.picks-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.picks-head h2{margin:0;font-size:15px}
.wknav{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wknav button{font:inherit;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.wknav button:disabled{opacity:.35;cursor:default}
a.hero,div.hero{display:block;text-decoration:none;color:inherit;border-radius:12px;padding:18px;background:linear-gradient(135deg,var(--cb-soft),var(--accent-soft));border:1px solid var(--line)}
a.hero:hover{border-color:var(--cb)}
.hero .label{font-size:12px;font-weight:700;color:var(--cb);letter-spacing:.02em}
.hero .hname{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px;word-break:keep-all}
.hero .hmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hero .why{margin:12px 0 0;font-size:14px;line-height:1.55;color:var(--text)}
.hero.empty .hname{font-size:17px;font-weight:700}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.slot{display:flex;flex-direction:column;gap:4px;min-height:84px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
a.slot:hover{border-color:var(--accent)}
.slot .sd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .sn{font-size:14px;font-weight:700;line-height:1.3;word-break:keep-all}
.slot .ss{font-size:12px;color:var(--muted);margin-top:auto}
.slot.picked{border-color:var(--cb);background:var(--cb-soft)}
.slot.weekly{border-width:2px}
.slot.open{border-style:dashed}
.slot.none{opacity:.5}
.slot .cand{font-size:11px;font-weight:700;color:var(--accent)}
.archive{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.archive h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.archive a{display:flex;gap:10px;align-items:baseline;padding:6px 0;text-decoration:none;color:var(--text);font-size:14px;border-bottom:1px dashed var(--line)}
.archive a:hover .an{color:var(--accent)}
.archive .aw{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:64px}
.archive .an{font-weight:700}
.archive .ar{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.badge{font-size:12px}
.wknav button.blogbtn,.blogbtn{width:auto;height:30px;padding:0 10px;font:inherit;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;margin-right:6px}
.blogbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.blog-pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.blog-pick select{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.blog{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.blog-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--bg);font-size:13px;color:var(--muted)}
.blog-paper{background:#fff;color:#222;padding:24px 28px;max-height:560px;overflow:auto;font-size:15px;line-height:1.75}
.blog-paper h1{font-size:22px;margin:0 0 12px} .blog-paper h2{font-size:18px} .blog-paper h3{font-size:16px} .blog-paper h4{font-size:15px}
.blog-paper table{border-collapse:collapse;margin:8px 0} .blog-paper a{color:#2a5bd7}
@media (max-width:640px){.blogbtn .lbl{display:none}}
@media (max-width:640px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .hname{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<nav class="side" aria-label="페이지">
  <div class="brand">시장 리서치</div>
  <a href="index.html" aria-current="page">컨센서스 노트<small>증권사 리포트 기록</small></a>
  <a href="aluminum.html">LME 알루미늄 팔로우<small>삼아알미늄 판가</small></a>
</nav>
<div class="wrap">
  <header>
    <div>
      <h1>컨센서스 노트</h1>
      <p class="sub">카드를 누르면 노션 페이지가 열려요.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="picks" aria-labelledby="pk-title">
    <div class="picks-head">
      <h2 id="pk-title">🏆 금주의 보고서</h2>
      <div class="wknav">
        <button id="blog-open" class="blogbtn">✎ 블로그 글 만들기</button>
        <button id="pk-prev" aria-label="이전 주">‹</button>
        <span id="pk-range"></span>
        <button id="pk-next" aria-label="다음 주">›</button>
      </div>
    </div>
    <div id="pk-hero"></div>
    <div class="slots" id="pk-slots"></div>
    <div class="archive" id="pk-archive" hidden></div>
    <div class="blog" id="blog" hidden>
      <div class="blog-bar">
        <span class="blog-pick">
          <select id="blog-mode" aria-label="글 종류"><option value="day">하루 글</option><option value="week">주간 글</option></select>
          <select id="blog-day" aria-label="날짜"></select>
          <span id="blog-weeklbl"></span>
        </span>
        <span><button id="blog-copy" class="blogbtn primary">복사</button> <button id="blog-close" class="blogbtn">닫기</button></span>
      </div>
      <div class="blog-paper" id="blog-paper"></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="wk-title">
    <div class="panel-head">
      <div>
        <h2 id="wk-title">주간 읽은 리포트 수</h2>
        <p id="wk-sub">월요일 시작 기준 · 아래 검색·필터가 함께 적용돼요</p>
      </div>
      <div class="kpi" id="wk-kpi"></div>
    </div>
    <div class="chart" id="wk-chart"></div>
    <details class="tbl"><summary>표로 보기</summary><div id="wk-table"></div></details>
  </section>

  <div class="bar">
    <input id="q" type="search" placeholder="기업명 · 증권사 검색" aria-label="검색">
    <select id="op" aria-label="투자의견">
      <option value="">모든 투자의견</option>
      <option value="C">CONVICTION BUY</option>
      <option value="B">BUY</option>
      <option value="H">HOLD</option>
      <option value="N">NR</option>
      <option value="J">수주 코멘트</option>
    </select>
    <select id="broker" aria-label="증권사"><option value="">모든 증권사</option></select>
    <label class="toggle"><input type="checkbox" id="study">공부하자만</label>
  </div>

  <main id="list"></main>
  <footer id="foot"></footer>
</div>
</div>

<script src="data.js"></script>
<script>
(function(){
  const OP = {C:"CONVICTION BUY",B:"BUY",H:"HOLD",S:"SELL",N:"NR",J:"수주 코멘트"};
  const DAYS = ["일","월","화","수","목","금","토"];
  const data = (window.CONSENSUS && window.CONSENSUS.rows) || [];

  // 예전 기록은 "기업명(증권사)" 형식이라 분리해서 보여줌
  const rows = data.map(([id,d,c,b,o,u,s,p,why]) => {
    let name = c || "(제목 없음)", broker = b || "";
    if (!broker) {
      const m = name.match(/^(.+?)\s*\((.+)\)$/);
      if (m) { name = m[1]; broker = m[2]; }
    }
    return {id, d: d || "", name: name.replace(/\s+/g," ").trim(), broker, ops: o ? o.split("|") : [], u, s, pick: p || 0, why: why || ""};
  });

  // 증권사 목록
  const brokers = [...new Set(rows.map(r => r.broker).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
  const bSel = document.getElementById("broker");
  brokers.forEach(b => { const o = document.createElement("option"); o.value = b; o.textContent = b; bSel.appendChild(o); });

  function dateLabel(d){
    if (!/^\d{6}$/.test(d)) return "날짜 미지정";
    const y = 2000 + +d.slice(0,2), m = +d.slice(2,4), day = +d.slice(4,6);
    const w = DAYS[new Date(y, m-1, day).getDay()];
    return `${m}월 ${day}일 (${w})`;
  }

  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function card(r){
    const a = el("a","card");
    a.href = "https://www.notion.so/" + r.id;
    a.target = "_blank"; a.rel = "noopener";
    const top = el("div","top");
    const code = el("span","code", r.d || "—");
    if (r.pick) { const bd = el("span","badge", r.pick === 2 ? " 🏆" : " 🏅"); bd.title = r.pick === 2 ? "금주의 보고서" : "오늘의 보고서"; code.appendChild(bd); }
    top.appendChild(code);
    if (r.ops.length) r.ops.forEach(o => top.appendChild(el("span","chip "+o, OP[o]||o)));
    a.appendChild(top);
    a.appendChild(el("div","name", r.name));
    const meta = el("div","meta");
    const left = el("span", null, r.broker || "");
    if (r.s === 1) { const st = el("span","study"," · 공부하자"); left.appendChild(st); }
    meta.appendChild(left);
    if (typeof r.u === "number") {
      meta.appendChild(el("span","up "+(r.u>=0?"pos":"neg"), (r.u>0?"+":"")+r.u+"%"));
    }
    a.appendChild(meta);
    a.title = `${r.d} ${r.name}${r.broker?" · "+r.broker:""} — 노션에서 열기`;
    return a;
  }

  const $q = document.getElementById("q"), $op = document.getElementById("op"), $st = document.getElementById("study"), $list = document.getElementById("list");

  function render(){
    const q = $q.value.trim().toLowerCase(), op = $op.value, br = bSel.value, st = $st.checked;
    const f = rows.filter(r =>
      (!q || r.name.toLowerCase().includes(q) || r.broker.toLowerCase().includes(q) || r.d.includes(q)) &&
      (!op || r.ops.includes(op)) && (!br || r.broker === br) && (!st || r.s === 1));
    lastFiltered = f;
    renderWeekly(f);
    const groups = new Map();
    f.forEach(r => { if (!groups.has(r.d)) groups.set(r.d, []); groups.get(r.d).push(r); });
    const keys = [...groups.keys()].sort((a,b) => (b||"0").localeCompare(a||"0"));
    $list.replaceChildren();
    if (!keys.length) { $list.appendChild(el("div","empty","조건에 맞는 기록이 없어요.")); return; }
    keys.forEach(k => {
      const sec = el("section","day");
      const h = el("div","day-head");
      h.appendChild(el("h2", null, dateLabel(k)));
      h.appendChild(el("span", null, `${k ? k+" · " : ""}${groups.get(k).length}건`));
      sec.appendChild(h);
      const g = el("div","grid");
      groups.get(k).forEach(r => g.appendChild(card(r)));
      sec.appendChild(g);
      $list.appendChild(sec);
    });
  }

  // ── 주간 그래프 ──
  const SVGNS = "http://www.w3.org/2000/svg";
  let lastFiltered = rows;
  function svg(tag, attrs){ const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function toDate(d){ return new Date(2000 + +d.slice(0,2), +d.slice(2,4) - 1, +d.slice(4,6)); }
  function monday(dt){ const x = new Date(dt); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function md(dt){ return `${dt.getMonth()+1}/${dt.getDate()}`; }

  // 전체 데이터 기준으로 주 범위를 고정 (필터해도 x축이 흔들리지 않게)
  const allDates = rows.map(r => r.d).filter(d => /^\d{6}$/.test(d)).sort();
  const weeks = [];
  if (allDates.length) {
    const end = monday(toDate(allDates[allDates.length-1]));
    for (let w = monday(toDate(allDates[0])); w <= end; w = new Date(w.getFullYear(), w.getMonth(), w.getDate() + 7)) weeks.push(w);
  }
  const wkKey = dt => dt.getFullYear()*10000 + (dt.getMonth()+1)*100 + dt.getDate();

  function renderWeekly(f){
    const counts = new Map(weeks.map(w => [wkKey(w), 0]));
    f.forEach(r => { if (/^\d{6}$/.test(r.d)) { const k = wkKey(monday(toDate(r.d))); counts.set(k, (counts.get(k) || 0) + 1); } });
    const pts = weeks.map(w => { const e = new Date(w); e.setDate(e.getDate() + 6); return {w, e, n: counts.get(wkKey(w)) || 0}; });

    // KPI: 이번 주 vs 지난주
    const kpi = document.getElementById("wk-kpi"); kpi.replaceChildren();
    if (pts.length) {
      const cur = pts[pts.length-1], prev = pts[pts.length-2];
      kpi.appendChild(el("b", null, cur.n + "건"));
      kpi.appendChild(document.createTextNode(`이번 주 (${md(cur.w)}~) `));
      if (prev) {
        const diff = cur.n - prev.n;
        kpi.appendChild(el("span", "delta " + (diff > 0 ? "pos" : diff < 0 ? "neg" : ""), `지난주 대비 ${diff > 0 ? "+" : ""}${diff}`));
      }
    }

    // 표
    const tw = document.getElementById("wk-table"); tw.replaceChildren();
    const t = el("table"), hr = el("tr");
    hr.appendChild(el("th", null, "주")); hr.appendChild(el("th", null, "건수")); t.appendChild(hr);
    pts.slice().reverse().forEach(p => { const tr = el("tr"); tr.appendChild(el("td", null, `${md(p.w)} ~ ${md(p.e)}`)); tr.appendChild(el("td", null, p.n)); t.appendChild(tr); });
    tw.appendChild(t);

    // 그래프
    const box = document.getElementById("wk-chart"); box.replaceChildren();
    if (!pts.length) return;
    const W = Math.max(box.clientWidth, 280), H = 220, m = {t: 18, r: 14, b: 26, l: 30};
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const maxN = Math.max(...pts.map(p => p.n), 1);
    const step = maxN <= 5 ? 1 : maxN <= 20 ? 5 : maxN <= 50 ? 10 : maxN <= 100 ? 20 : 50;
    const top = Math.ceil(maxN / step) * step;
    const x = i => m.l + (pts.length === 1 ? iw/2 : i * iw / (pts.length - 1));
    const y = n => m.t + ih - n / top * ih;

    const s = svg("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "주간 읽은 리포트 수 선 그래프"});
    const g = svg("g", {class: "grid"}), ax = svg("g", {class: "axis"});
    for (let v = 0; v <= top; v += step) {
      g.appendChild(svg("line", {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v)}));
      const tx = svg("text", {x: m.l - 8, y: y(v) + 4, "text-anchor": "end"}); tx.textContent = v; ax.appendChild(tx);
    }
    const every = Math.ceil(pts.length / Math.max(1, Math.floor(iw / 56)));
    pts.forEach((p, i) => {
      if (i % every && i !== pts.length - 1) return;
      const tx = svg("text", {x: x(i), y: H - 6, "text-anchor": "middle"}); tx.textContent = md(p.w); ax.appendChild(tx);
    });
    s.appendChild(g); s.appendChild(ax);

    const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.n)}`).join("");
    s.appendChild(svg("path", {class: "area", d: `${d}L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`}));
    s.appendChild(svg("path", {class: "line", d}));
    pts.forEach((p, i) => s.appendChild(svg("circle", {class: "dot", cx: x(i), cy: y(p.n), r: 4})));

    // 최댓값과 마지막 값만 직접 표시
    const maxI = pts.findIndex(p => p.n === maxN);
    [...new Set([maxI, pts.length - 1])].forEach(i => {
      const tx = svg("text", {class: "vlabel", x: x(i), y: y(pts[i].n) - 9, "text-anchor": "middle"}); tx.textContent = pts[i].n; s.appendChild(tx);
    });

    // 호버: 십자선 + 툴팁
    const cross = svg("line", {class: "cross", y1: m.t, y2: m.t + ih, visibility: "hidden"});
    const hot = svg("circle", {class: "dot", r: 6, visibility: "hidden"});
    s.appendChild(cross); s.appendChild(hot);
    const hit = svg("rect", {x: m.l - 10, y: 0, width: iw + 20, height: H, fill: "transparent"});
    s.appendChild(hit);
    box.appendChild(s);
    const tip = el("div", "tip"); tip.hidden = true; box.appendChild(tip);

    function show(evt){
      const rect = s.getBoundingClientRect();
      const px = (evt.clientX - rect.left) * W / rect.width;
      let i = pts.length === 1 ? 0 : Math.round((px - m.l) / (iw / (pts.length - 1)));
      i = Math.max(0, Math.min(pts.length - 1, i));
      const p = pts[i];
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      hot.setAttribute("cx", x(i)); hot.setAttribute("cy", y(p.n)); hot.setAttribute("visibility", "visible");
      tip.replaceChildren(el("b", null, p.n + "건"), el("br"), document.createTextNode(`${md(p.w)} ~ ${md(p.e)}`));
      tip.style.left = (x(i) * rect.width / W) + "px";
      tip.style.top = (y(p.n) * rect.height / H) + "px";
      tip.hidden = false;
    }
    function hide(){ cross.setAttribute("visibility", "hidden"); hot.setAttribute("visibility", "hidden"); tip.hidden = true; }
    hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", hide);
  }
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => renderWeekly(lastFiltered), 150); });

  // ── 금주의 보고서 / 오늘의 보고서 ──
  const notion = id => "https://www.notion.so/" + id;
  const ymd = dt => String(dt.getFullYear() % 100).padStart(2,"0") + String(dt.getMonth()+1).padStart(2,"0") + String(dt.getDate()).padStart(2,"0");
  const addDays = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
  const thisWeek = monday(new Date());
  const firstWeek = weeks.length ? weeks[0] : thisWeek;
  let pkWeek = thisWeek;

  // 선정이 없는 날의 추천 후보: 여러 증권사가 다룬 기업 > CONVICTION BUY > UPSIDE
  function candidate(list){
    const cover = {};
    list.forEach(r => { cover[r.name] = (cover[r.name] || 0) + 1; });
    const scored = list.filter(r => r.ops.length || typeof r.u === "number")
      .map(r => ({r, sc: cover[r.name] * 1000 + (r.ops.includes("C") ? 500 : 0) + (r.u || 0)}))
      .sort((a, b) => b.sc - a.sc);
    return scored.length ? {r: scored[0].r, n: cover[scored[0].r.name]} : null;
  }

  function renderPicks(){
    const mon = pkWeek, sun = addDays(mon, 6);
    document.getElementById("pk-range").textContent = `${md(mon)} ~ ${md(sun)}`;
    document.getElementById("pk-prev").disabled = mon <= firstWeek;
    document.getElementById("pk-next").disabled = mon >= thisWeek;

    const keys = new Set([0,1,2,3,4,5,6].map(i => ymd(addDays(mon, i))));
    const inWeek = rows.filter(r => keys.has(r.d));
    const weekly = inWeek.find(r => r.pick === 2);
    const dailies = inWeek.filter(r => r.pick >= 1);

    // 히어로
    const hero = document.getElementById("pk-hero"); hero.replaceChildren();
    if (weekly) {
      const a = el("a","hero"); a.href = notion(weekly.id); a.target = "_blank"; a.rel = "noopener";
      a.appendChild(el("div","label", `금주의 보고서 · ${dateLabel(weekly.d)}`));
      a.appendChild(el("div","hname", weekly.name));
      const hm = el("div","hmeta");
      if (weekly.broker) hm.appendChild(el("span", null, weekly.broker));
      weekly.ops.forEach(o => hm.appendChild(el("span","chip "+o, OP[o]||o)));
      if (typeof weekly.u === "number") hm.appendChild(el("span","up "+(weekly.u>=0?"pos":"neg"), (weekly.u>0?"+":"")+weekly.u+"%"));
      a.appendChild(hm);
      if (weekly.why) a.appendChild(el("p","why", "“" + weekly.why + "”"));
      hero.appendChild(a);
    } else {
      const d = el("div","hero empty");
      d.appendChild(el("div","label", "금주의 보고서"));
      d.appendChild(el("div","hname", dailies.length ? `아직 선정 전이에요 · 후보 ${dailies.length}개` : "아직 선정 전이에요"));
      d.appendChild(el("div","hmeta", dailies.length
        ? "노션에서 아래 오늘의 보고서 중 하나의 '선정'을 금주의로 바꿔 주세요."
        : "노션에서 매일 하나씩 '선정'을 오늘의로 골라 주세요. 주말에 그중 하나를 금주의로 고르면 여기에 떠요."));
      hero.appendChild(d);
    }

    // 월~금 슬롯
    const slots = document.getElementById("pk-slots"); slots.replaceChildren();
    for (let i = 0; i < 5; i++) {
      const day = addDays(mon, i), key = ymd(day), list = rows.filter(r => r.d === key);
      const picked = list.find(r => r.pick === 2) || list.find(r => r.pick === 1);
      const head = `${DAYS[day.getDay()]} ${md(day)}`;
      let s;
      if (picked) {
        s = el("a", "slot picked" + (picked.pick === 2 ? " weekly" : ""));
        s.href = notion(picked.id); s.target = "_blank"; s.rel = "noopener";
        s.appendChild(el("span","sd", head + (picked.pick === 2 ? " · 🏆" : " · 🏅")));
        s.appendChild(el("span","sn", picked.name));
        s.appendChild(el("span","ss", picked.broker || ""));
      } else if (list.length) {
        const c = candidate(list);
        s = el(c ? "a" : "div", "slot open");
        if (c) { s.href = notion(c.r.id); s.target = "_blank"; s.rel = "noopener"; }
        s.appendChild(el("span","sd", `${head} · 미선정`));
        if (c) {
          s.appendChild(el("span","cand", "추천 후보"));
          s.appendChild(el("span","sn", c.r.name));
          s.appendChild(el("span","ss", c.n > 1 ? `${c.n}개 증권사 · ${list.length}건 중` : `${c.r.broker || ""} · ${list.length}건 중`));
        } else s.appendChild(el("span","ss", `${list.length}건`));
      } else {
        s = el("div","slot none");
        s.appendChild(el("span","sd", head));
        s.appendChild(el("span","ss", "기록 없음"));
      }
      slots.appendChild(s);
    }

    // 지난 금주의 보고서
    const arc = document.getElementById("pk-archive"); arc.replaceChildren();
    const past = rows.filter(r => r.pick === 2 && /^\d{6}$/.test(r.d)).sort((a, b) => b.d.localeCompare(a.d));
    arc.hidden = !past.length;
    if (past.length) {
      arc.appendChild(el("h3", null, "명예의 전당"));
      past.forEach(r => {
        const a = el("a"); a.href = notion(r.id); a.target = "_blank"; a.rel = "noopener";
        a.appendChild(el("span","aw", md(monday(toDate(r.d))) + " 주"));
        a.appendChild(el("span","an", r.name));
        a.appendChild(el("span","ar", [r.broker, r.why].filter(Boolean).join(" · ")));
        arc.appendChild(a);
      });
    }
  }
  // ── 블로그 글 초안 ──
  const NOTES = window.NOTES || {};
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const opTxt = r => r.ops.map(o => OP[o] || o).join(", ");
  const upTxt = r => typeof r.u === "number" ? (r.u > 0 ? "+" : "") + r.u + "%" : "";
  function metaLine(r){ return [r.broker, opTxt(r), upTxt(r) && "UPSIDE " + upTxt(r)].filter(Boolean).map(esc).join(" · "); }
  function noteBlock(r){
    const why = r.why ? `<blockquote style="border-left:3px solid #f0b429;margin:8px 0;padding:2px 0 2px 12px;color:#555">선정 이유: ${esc(r.why)}</blockquote>` : "";
    const body = NOTES[r.id];
    return why + (body ? body : `<p style="color:#999">(노션 본문은 다음 동기화 때 들어가요)</p>`);
  }
  function buildBlog(){
    const mon = pkWeek, sun = addDays(mon, 6);
    const keys = new Set([0,1,2,3,4,5,6].map(i => ymd(addDays(mon, i))));
    const inWeek = rows.filter(r => keys.has(r.d));
    const weekly = inWeek.find(r => r.pick === 2);
    const dailies = inWeek.filter(r => r.pick >= 1).sort((a, b) => a.d.localeCompare(b.d));
    const nth = Math.ceil(mon.getDate() / 7);
    const title = `${mon.getMonth()+1}월 ${nth}주차 컨센서스 노트` + (weekly ? ` | 금주의 보고서: ${weekly.name}` : "");
    const dayOf = r => DAYS[toDate(r.d).getDay()];
    let h = `<h1>${esc(title)}</h1>`;
    h += `<p>이번 주(${md(mon)}~${md(sun)})에는 증권사 리포트 <b>${inWeek.length}건</b>을 읽었어요. 매일 하나씩 고른 '오늘의 보고서'${weekly ? "와 그중 가장 인상 깊었던 '금주의 보고서'" : ""}를 정리합니다.</p>`;
    if (dailies.length) {
      h += `<h2>📌 이번 주 오늘의 보고서</h2><table style="border-collapse:collapse"><tr>` +
        ["요일","기업","증권사","투자의견","UPSIDE"].map(c => `<th style="border:1px solid #ccc;padding:4px 10px;background:#f6f6f6">${c}</th>`).join("") + "</tr>" +
        dailies.map(r => `<tr>${[dayOf(r) + " " + md(toDate(r.d)), (r.pick === 2 ? "🏆 " : "") + r.name, r.broker, opTxt(r), upTxt(r)].map(c => `<td style="border:1px solid #ccc;padding:4px 10px">${esc(c)}</td>`).join("")}</tr>`).join("") + "</table>";
    }
    if (weekly) h += `<h2>🏆 금주의 보고서 · ${esc(weekly.name)}</h2><p><b>${metaLine(weekly)}</b> · ${esc(dateLabel(weekly.d))}</p>` + noteBlock(weekly);
    dailies.filter(r => r !== weekly).forEach(r => {
      h += `<h3>${esc(dayOf(r) + " " + md(toDate(r.d)))} · ${esc(r.name)}</h3><p><b>${metaLine(r)}</b></p>` + noteBlock(r);
    });
    if (!dailies.length) h += `<p style="color:#999">(이번 주에 선정한 보고서가 아직 없어요. 노션에서 '선정'을 골라 주세요.)</p>`;
    const tags = ["컨센서스", "증권사리포트", "주식공부", "금주의보고서", ...dailies.map(r => r.name.replace(/\s+/g, ""))];
    h += `<p style="color:#888">${[...new Set(tags)].map(t => "#" + esc(t)).join(" ")}</p>`;
    return h;
  }
  // 하루 글: 그날 읽은 리포트 전체 표 + 오늘의 보고서 본문
  function buildDaily(key){
    const list = rows.filter(r => r.d === key);
    const pick = list.find(r => r.pick === 2) || list.find(r => r.pick === 1);
    const dt = toDate(key), day = DAYS[dt.getDay()];
    const title = `${dt.getMonth()+1}월 ${dt.getDate()}일(${day}) 컨센서스 노트` + (pick ? ` | 오늘의 보고서: ${pick.name}` : "");
    let h = `<h1>${esc(title)}</h1>`;
    h += `<p>오늘은 증권사 리포트 <b>${list.length}건</b>을 읽었어요.${pick ? ` 그중 오늘의 보고서로 <b>${esc(pick.name)}</b>을(를) 골랐어요.` : ""}</p>`;
    h += `<h2>📋 오늘 읽은 리포트</h2><table style="border-collapse:collapse"><tr>` +
      ["기업","증권사","투자의견","UPSIDE"].map(c => `<th style="border:1px solid #ccc;padding:4px 10px;background:#f6f6f6">${c}</th>`).join("") + "</tr>" +
      list.map(r => `<tr>${[(r === pick ? "🏅 " : "") + r.name, r.broker, opTxt(r), upTxt(r)].map(c => `<td style="border:1px solid #ccc;padding:4px 10px">${esc(c)}</td>`).join("")}</tr>`).join("") + "</table>";
    if (pick) h += `<h2>🏅 오늘의 보고서 · ${esc(pick.name)}</h2><p><b>${metaLine(pick)}</b></p>` + noteBlock(pick);
    else h += `<p style="color:#999">(이날 오늘의 보고서를 아직 고르지 않았어요. 노션에서 '선정'을 오늘의로 골라 주세요.)</p>`;
    const tags = ["컨센서스", "증권사리포트", "주식공부", "오늘의보고서", ...(pick ? [pick.name.replace(/\s+/g, "")] : [])];
    h += `<p style="color:#888">${[...new Set(tags)].map(t => "#" + esc(t)).join(" ")}</p>`;
    return h;
  }

  const $blog = document.getElementById("blog"), $paper = document.getElementById("blog-paper"), $copy = document.getElementById("blog-copy");
  const $mode = document.getElementById("blog-mode"), $day = document.getElementById("blog-day"), $wl = document.getElementById("blog-weeklbl");
  // 날짜 목록: 기록이 있는 날, 최신순. 선정한 날은 기업명을 같이 보여줌
  [...new Set(rows.map(r => r.d).filter(d => /^\d{6}$/.test(d)))].sort().reverse().forEach(k => {
    const list = rows.filter(r => r.d === k), p = list.find(r => r.pick === 2) || list.find(r => r.pick === 1);
    const o = document.createElement("option"); o.value = k;
    o.textContent = `${dateLabel(k)} · ${list.length}건${p ? " · 🏅 " + p.name : ""}`;
    $day.appendChild(o);
  });
  function renderBlog(){
    const day = $mode.value === "day";
    $day.hidden = !day;
    $wl.textContent = day ? "" : `${md(pkWeek)} ~ ${md(addDays(pkWeek, 6))} (‹ › 로 주 변경)`;
    $paper.innerHTML = day ? buildDaily($day.value) : buildBlog();
  }
  $mode.addEventListener("change", renderBlog);
  $day.addEventListener("change", renderBlog);
  document.getElementById("blog-open").addEventListener("click", () => { renderBlog(); $blog.hidden = false; $blog.scrollIntoView({behavior: "smooth", block: "nearest"}); });
  document.getElementById("blog-close").addEventListener("click", () => { $blog.hidden = true; });
  $copy.addEventListener("click", async () => {
    const htmlStr = $paper.innerHTML, text = $paper.innerText;
    let ok = false;
    try {
      await navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([htmlStr], {type: "text/html"}), "text/plain": new Blob([text], {type: "text/plain"})})]);
      ok = true;
    } catch (e) {
      const range = document.createRange(); range.selectNodeContents($paper);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      try { ok = document.execCommand("copy"); } catch (_) {}
      sel.removeAllRanges();
    }
    $copy.textContent = ok ? "복사됨 ✓" : "직접 선택해서 복사해 주세요";
    setTimeout(() => { $copy.textContent = "복사"; }, 2000);
  });

  document.getElementById("pk-prev").addEventListener("click", () => { pkWeek = addDays(pkWeek, -7); renderPicks(); if (!$blog.hidden) renderBlog(); });
  document.getElementById("pk-next").addEventListener("click", () => { pkWeek = addDays(pkWeek, 7); renderPicks(); if (!$blog.hidden) renderBlog(); });
  renderPicks();

  // 상단 요약
  const stats = document.getElementById("stats");
  [["전체 기록", rows.length], ["기록한 날", new Set(rows.map(r=>r.d).filter(Boolean)).size], ["공부하자", rows.filter(r=>r.s===1).length]]
    .forEach(([l,v]) => { const d = el("div"); d.appendChild(el("b", null, v)); d.appendChild(document.createTextNode(l)); stats.appendChild(d); });
  document.getElementById("foot").textContent = "마지막 동기화: " + ((window.CONSENSUS && window.CONSENSUS.updated) || "—");

  [$q,$op,bSel,$st].forEach(e => e.addEventListener("input", render));
  render();
})();
</script>
</body>
</html>
